<svg xmlns="http://www.w3.org/2000/svg" width="495" height="246" viewBox="0 0 495 246" role="img" aria-label="Top contributed repositories">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; }
    .row { opacity: 0; animation: fade 0.5s ease-out forwards; }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 0.8s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="494" height="245" rx="4.5" fill="#151515" stroke="#e4e2e2" stroke-opacity="0.2"/>
