  <g class="row" style="animation-delay:0ms">
    <circle cx="31" cy="73" r="5" fill="#3178c6"><title>TypeScript</title></circle>
    <text x="44" y="77" fill="#c9d1d9" font-size="13" font-weight="600">apiCopilot</text>
    <rect x="238" y="67" width="162" height="11" rx="5.5" fill="#2b2b2b"/>
    <rect class="bar" x="238" y="67" width="162" height="11" rx="5.5" fill="#1cadfb" style="animation-delay:200ms"/>
    <text x="470" y="77" fill="#9f9f9f" font-size="12" text-anchor="end">32 commits</text>
  </g>
